name: windows-build

on:
  push:
    branches: [master, main]
    paths:
      - 'windows/**'
      - 'scripts/**'
      - '.agents/**'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/**'
      - '.agents/**'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows extension
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/ItsycalForWindows.sln -p:Platform=x64

      - name: Build (Debug, x64)
        run: dotnet build windows/ItsycalForWindows.sln -c Debug -p:Platform=x64 --no-restore

      - name: Validate agent scaffold
        run: node scripts/scaffold-check.mjs
